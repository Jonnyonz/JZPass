version: '3.8'

services:
  # BACKEND - JZ PASS COMPATIBILIDAD POSTGRES
  jzpass-app:
    build: .
    container_name: jzpass_server
    restart: always
    ports:
      # Detras de un proxy inverso, poner APP_BIND=127.0.0.1 en el .env.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      # El codigo va dentro de la imagen (COPY . . en el Dockerfile); solo se monta uploads.
      - ./uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SETUP_TOKEN=${SETUP_TOKEN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
      - TZ=${TZ}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@jzpass-db:5432/${DB_NAME}
    # La IP real la resuelve la app segun TRUSTED_PROXIES; no se delega en uvicorn.
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - jzpass-db
    networks:
      - jzpass-net

  # MOTOR DE BASE DE DATOS ENTERPRISE
  jzpass-db:
    image: postgres:15-alpine
    container_name: jzpass_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - jzpass-net

  # HTTPS delante de la app. Lo activa install.sh (COMPOSE_PROFILES=https en el .env) y escribe
  # caddy/Caddyfile: con dominio saca el certificado solo; sin dominio usa la IP del servidor con la CA local
  # de Caddy. Sin HTTPS no se guarda la sesion desde otra PC ni el celular da la ubicacion para fichar.
  caddy:
    image: caddy:2-alpine
    container_name: jzpass_caddy
    profiles: ["https"]
    restart: always
    depends_on:
      - jzpass-app
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0}:${CADDY_HTTP_PORT-80}:80"
      - "0.0.0.0:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - jzpass-net

networks:
  jzpass-net:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
